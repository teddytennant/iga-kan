[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "igakan"
version = "0.1.0"
description = "1D isogeometric Kolmogorov-Arnold network toy fit"
requires-python = ">=3.10"
dependencies = [
  "jax",
  "numpy",
  "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
